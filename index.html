<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111f">
  <meta name="description" content="GDT 互动实验室：无需安装即可体验的浏览器小程序。">
  <title>GDT · 互动实验室</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #eaf2ff; background: #09111f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 70% 55% at 50% 10%, #19335e85, transparent 75%), #09111f; }
    .wrap { max-width: 940px; margin: 0 auto; padding: 44px 24px 80px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { font-size: 21px; font-weight: 800; letter-spacing: .06em; }
    .brand span { color: #8ecbff; }
    a { color: inherit; }
    .repo { color: #aab8d0; text-decoration: none; font-size: 13px; border: 1px solid #ffffff20; border-radius: 99px; padding: 10px 16px; }
    .repo:hover, .project:hover { border-color: #79b9ff88; }
    .eyebrow { margin-top: 108px; letter-spacing: .24em; color: #8baad4; font-size: 12px; font-weight: 700; }
    h1 { font-size: clamp(38px, 7vw, 65px); letter-spacing: -.05em; line-height: 1.17; margin: 16px 0 22px; }
    .lead { color: #9cacca; line-height: 1.9; max-width: 590px; font-size: 16px; }
    h2 { font-size: 18px; margin: 76px 0 20px; }
    .project { display: grid; grid-template-columns: 180px 1fr; overflow: hidden; text-decoration: none; border: 1px solid #ffffff20; border-radius: 24px; background: #16223a9a; transition: transform .2s ease, border-color .2s ease; }
    .project:hover { transform: translateY(-3px); }
    .art { min-height: 210px; display: grid; place-items: center; background: radial-gradient(circle at 52% 45%, #2b62a5 0%, #14233e 55%, #111a2c 90%); }
    .orb { width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #d9f9ff, #7acaff 24%, #347bdf 62%, #37308e); box-shadow: 0 0 45px #418cff99, inset -11px -13px 22px #16145477; }
    .body { padding: 28px 30px; display: flex; flex-direction: column; justify-content: center; }
    .tag { width: fit-content; padding: 6px 10px; background: #74b5ff18; color: #96c7ff; border-radius: 99px; font-size: 11px; font-weight: 700; }
    h3 { margin: 13px 0 8px; font-size: 23px; }
    .desc { color: #95a7c2; line-height: 1.8; margin: 0; font-size: 14px; }
    .go { color: #a7d7ff; font-size: 13px; font-weight: 700; margin-top: 22px; }
    footer { border-top: 1px solid #ffffff15; color: #71839f; font-size: 12px; margin-top: 90px; padding-top: 22px; }
    @media (max-width: 580px) { .wrap { padding: 28px 18px 56px; } .eyebrow { margin-top: 80px; } .project { grid-template-columns: 1fr; } .art { min-height: 160px; } .body { padding: 24px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">GDT<span> / LAB</span></div>
      <a class="repo" href="https://github.com/rushairer/GDT" target="_blank" rel="noopener noreferrer">GitHub 源码 ↗</a>
    </header>
    <main>
      <p class="eyebrow">EXPERIMENTS · MUSIC · INTERACTION</p>
      <h1>让想法，<br>变成可以玩的实验。</h1>
      <p class="lead">GDT 互动实验室，收录轻量、开源、无需安装的网页小程序。每个实验都可以直接在浏览器中体验。</p>
      <h2>在线实验</h2>
      <a class="project" href="./apps/central-c-ball/" aria-label="打开 88 键钢琴乐谱与演奏挑战">
        <div class="art"><div class="orb" aria-hidden="true"></div></div>
        <div class="body">
          <span class="tag">MuseScore · 乐曲创作 · 演奏挑战</span>
          <h3>88 键钢琴 · 乐谱与演奏挑战</h3>
          <p class="desc">导入 MuseScore 4 乐谱或自己编曲，读取反复与速度变化。下落条形按音符实际时值显示，通过真实演奏完成挑战。</p>
          <span class="go">打开在线演示 ↗</span>
        </div>
      </a>
    </main>
    <footer>© GDT · 无需注册 · 麦克风音频仅在本机浏览器中处理</footer>
  </div>
</body>
</html>
